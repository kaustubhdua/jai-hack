name: Python tests
on:
  push:
    branches: [main, "feature/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project, ML and test dependencies
        run: python -m pip install -e ".[dev,ml]"
      - name: Run tests
        run: pytest -q
