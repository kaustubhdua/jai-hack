name: Security checks
on:
  push:
    branches: [main, "hardening/**", "feature/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and security scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ml]" bandit pip-audit
      - name: Scan Python source for common security issues
        run: bandit -q -r src api scripts -ll
      - name: Audit installed Python dependencies
        run: pip-audit
