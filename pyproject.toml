[build-system]
requires = ["setuptools>=84.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersentinel"
version = "0.1.0"
description = "Offline multi-agent network-flow intrusion detection prototype"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1.0", "python-multipart>=0.0.20", "numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "joblib>=1.3"]

[project.optional-dependencies]
ml = ["numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "joblib>=1.3", "pyarrow>=14.0", "matplotlib>=3.8"]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]
xgboost = ["xgboost>=2.0"]

[project.scripts]
cybersentinel = "cybersentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
